# Task candidates:
# - straight_config_traffic-v0: generated straight road with configurable traffic
# - single_scenario-v0: one generated scenario (map X)
# - multi_scenario-v0: multiple generated scenarios (maps XCO)
# - real_scenario-v0: recorded Waymo/Geely scenarios; required for imitation
task: straight_config_traffic-v0
modality: state       # state (pixels is not implemented yet)

# workflow.type selects the lifecycle. workflow.policy selects one of four
# peer policies; evolution and imitation settings are configured separately.
workflow:
  type: deploy           # deploy | evolution
  policy: Poly                 # IDM | Poly | Zero | imitation
  evolution:
    strategy: RLBoost
    learner: SAC
  policies:
    IDM:
      checkpoint: null
    Zero:
      checkpoint: null
    Poly:
      checkpoint: auto       # Standard task/map/train_name SAC directory
    imitation:
      model: wayformer       # wayformer | pluto
      source: ../UniTraj_benchmark_sample  # UniTraj repository root
      checkpoint: artifacts/weights/imitation/wayformer/brier_fde=1.45.ckpt
                               # Relative to the project root
      closed_loop: true
      warmup_steps: 21
      replan_frequency: 5
      prediction_horizon: 60
      controller:
        dt: 0.1
        lateral_pid: {kp: 0.8, ki: 0.05, kd: 0.0}
        longitudinal_pid: {kp: 2.0, ki: 0.0, kd: 0.0}
        lookahead: {min_distance: 2.0, max_distance: 6.0}
runtime:
  seed: 10
  device: auto             # auto | cpu | cuda

simulation:
  vectorized: false
  num_envs: 1
  render: true
  lane_count: 4

evaluation:
  mode: closed_loop
  episodes: 1
  max_steps: 400
  interval_steps: 100000
  save_video: false

logging:
  wandb:
    enabled: false
    project: HEAD
    entity: shuo_yang

artifacts:
  root: artifacts
  weights:
    evolution: weights/evolution
    imitation: weights/imitation
  logs: logs
  evaluation: eval
