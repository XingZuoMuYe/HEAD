[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "head"
version = "0.1.0"
requires-python = ">=3.9,<3.12"
description = "HEAD project"
authors = [{name = "Shuo Yang", email = "shuo_yang@tongji.edu.cn"}]
dependencies = []

[tool.setuptools]
package-dir = {head = ".", evaluation = "../evaluation"}
include-package-data = false

[tool.setuptools.packages.find]
where = [".."]
include = ["head", "head.*", "evaluation", "evaluation.*"]
exclude = ["head.scenario_datasets*", "head.build*", "head.dist*",
           "head.*.build*", "head.*.__pycache__*"]
namespaces = true

[tool.setuptools.package-data]
head = [
    "configs/*.yaml",
    "model/**/*.yaml",
    "model/**/LICENSE*",
    "model/**/*.md",
    "configs/tasks/*.yaml",
    "model/poly/common/local_planner/*.cpp",
    "model/poly/common/local_planner/*.pyx",
    "model/poly/common/local_planner/CMakeLists.txt",
    "model/poly/common/local_planner/compile_command.txt"
]
